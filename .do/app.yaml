name: qpanda-demo
static_sites:
- name: qpanda-web
  source_dir: /
  github:
    repo: your-username/qpanda
    branch: main
  build_command: npm ci && npm run build
  output_dir: /out
  index_document: index.html
  error_document: 404.html
  catchall_document: index.html
  cors:
    allow_origins:
    - exact: https://your-domain.com
    - regex: '^.*\.your-domain\.com$'
    allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    allow_headers:
    - Content-Type
    - X-Requested-With
  routes:
  - path: /
  - path: /404
